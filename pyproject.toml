[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidecut"
version = "0.10.2"
description = "Converte apresentacoes e documentos para PDF e corta em capitulos nas paginas divisoras coloridas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "pywin32>=306; sys_platform == 'win32'",
    "tkinterdnd2>=0.4",
    "pdf2docx>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "python-pptx>=1.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
slidecut-gui = "slidecut.gui:main"

[project.scripts]
slidecut = "slidecut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidecut = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: exercita o LibreOffice de verdade (mais lento)",
    "real_office: consulta o Microsoft Office instalado nesta maquina",
]

[tool.coverage.run]
source = ["slidecut"]
omit = ["*/__main__.py"]
